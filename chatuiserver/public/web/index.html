      position: fixed;
      width: 100%;
      height: 100%;
      background-color: #249B48;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

<body>
  <!-- Splash screen -->
  <div id="loading-screen">
    <img src="assets/assets/loading.gif" alt="Loading..." id="loading-gif">
  </div>

  <!-- Load Flutter -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    const preloadImages = ["assets/assets/loading.gif", "assets/assets/paper_basket.png", "assets/assets/paper_box.png", "assets/assets/sample_dish.png"];

    function preload(callback) {
      let loaded = 0;
      const total = preloadImages.length;

      preloadImages.forEach((src) => {
        const img = new Image();
        img.src = src;
        img.onload = () => {
          loaded++;
          if (loaded === total) {
            callback(); 
          }
        };
      });
    }

        }
      }).then(function (engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function (appRunner) {
        document.getElementById('loading-screen').style.display = 'none';
        return appRunner.runApp();
      });
    });
  </script>
</body>
