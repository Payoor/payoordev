<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Payment Confirmed!</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Jumbotron styles */
        .jumbotron {
            background-color: #249B48;
            text-align: center;
            padding: 3rem 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jumbotron__image {
            height: 7rem;
            width: auto;
            overflow: hidden;
        }

        .jumbotron img {
            height: 100%;
            width: auto;
            object-fit: cover;
        }

        /* Content container */
        .content {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 8px;
        }

        .order__content {
            position: relative;
            z-index: 2;
            padding-bottom: 8rem;
        }

        /* Main heading */
        h1 {
            color: #333333;
            text-align: center;
            margin-bottom: 2rem;
            text-transform: uppercase;
            font-size: 2.6;
        }

        /* Order section */
        .order {
            margin-bottom: 2rem;
        }

        .order__list {
            border-radius: 4px;
            padding: 1rem 2rem;
            background-color: #f9f9f9;
        }

        .order__list--items {
            margin-bottom: 1rem;
        }

        .order__list--item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }

        .order__list--total {
            display: flex;
            justify-content: space-between;
            padding-top: 1rem;
            font-weight: bold;
            border-top: .5px solid #000000;
        }

        /* Address section */
        .address {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 2rem;
        }

        .address p {
            margin: 0;
            color: #000000;
            text-align: center;
        }

        /* Basket/delivery image */
        .basket {
            text-align: center;
            margin: 0;
            position: absolute;
            bottom: 0;
            left: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 1;
        }

        .basket__image {
            height: 11rem;
            width: 23rem;
        }

        .basket img {
            height: 100%;
            width: auto;
            object-fit: cover;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <figure class="jumbotron">
        <figure class="jumbotron__image">
            <img src="https://payoorimages.s3.ap-southeast-2.amazonaws.com/payoorlogo.png" />
        </figure>
    </figure>

    <div class="content">
        <h1>Order Confirmed</h1>

        <div class="order__content">
            <div class="order">
                <div class="order__list">
                    <div class="order__list--items">
                        <div class="order__list--item">
                            <span>Rice</span>
                            <span>2000</span>
                        </div>
                    </div>
                    <div class="order__list--total">
                        <span>Total</span>
                        <span>N7000</span>
                    </div>
                </div>
            </div>

            <div class="address">
                <p>To be delivered to No 10 Address Test Street on 17/04/2025</p>
            </div>
        </div>

        <div class="basket">
            <figure class="basket__image">
                <img src="https://payoorimages.s3.ap-southeast-2.amazonaws.com/bike.png" />
            </figure>
        </div>
    </div>
</body>

</html>
