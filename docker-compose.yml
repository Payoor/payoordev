version: '3.8'
services:
  payoorserver:
    container_name: payoorserver
    build: ${NGINX_CONTEXT:-./nginx}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/data/certs:/etc/nginx/data/certs
    depends_on:
      - nodeserver
      - adminui
      - chatuiserver
      - llmserver
      - services
    networks:
      - payoor_network      

  payoordb:
    container_name: payoordb
    image: mongo
    ports:
      - "27017:27017" 
    volumes:
      - mongo_data:/data/db
    networks:
      - payoor_network  

  redisdb:
    container_name: redisdb
    image: redis:latest
    command: redis-server --appendonly yes --save 900 1 300 10 60 10000
    ports:
      - "6379:6379"  
    volumes:
      - redis_data:/data  
    networks:
      - payoor_network

  nodeserver:
    container_name: nodeserver
    restart: always
    build: ./nodeserver
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - payoordb
    networks:
      - payoor_network

  adminui:
    container_name: adminui
    restart: always
    build: ./adminui
    networks:
      - payoor_network

  chatuiserver:
    container_name: chatuiserver
    restart: always
    build: ./chatuiserver
    networks:
      - payoor_network

  llmserver:
    container_name: llmserver
    build: ./llmserver
    restart: always
    networks:
      - payoor_network

  services:
    container_name: services
    restart: always
    build: ./services
    networks:
      - payoor_network 

  errorserver:
    container_name: errorserver
    restart: always
    build: ./errorlogs
    networks:
      - payoor_network   

networks:
  payoor_network:
    driver: bridge

volumes:
  redis_data: 
  mongo_data: