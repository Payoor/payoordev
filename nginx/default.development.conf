map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream socketio_nodes {
    ip_hash;
    server nodeserver:8080;
}

server {
    listen 80;
    server_name server.development.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name server.development.payoor.store;

    ssl_certificate /etc/nginx/certs/nodeserver/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nodeserver/privkey.pem;

    location / {
        add_header 'Access-Control-Allow-Origin' 'https://chat.development.payoor.store';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
    
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://chat.development.payoor.store';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        proxy_pass http://nodeserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name chat.development.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.development.payoor.store;

    ssl_certificate /etc/nginx/certs/chatuiserver/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/chatuiserver/privkey.pem;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://chatuiserver:8083;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name admin.development.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.development.payoor.store;

    ssl_certificate /etc/nginx/certs/admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin/privkey.pem;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://adminui:8082;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name llmserver.development.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name llmserver.development.payoor.store;

    ssl_certificate /etc/nginx/certs/llmserver/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/llmserver/privkey.pem;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://llmserver:8084;
        proxy_redirect off;

        # Timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
