map $http_origin $cors_origin {
    default "";
    "https://chat.payoor.store" $http_origin;
    "https://admin.payoor.store" $http_origin;
    "https://admin.development.payoor.store" $http_origin;
    "https://chat.development.payoor.store" $http_origin;
    "http://localhost:63882" $http_origin;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name payoor.store www.payoor.store;

    ssl_certificate /etc/nginx/certs/home/prod/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/home/prod/privkey.pem;
    
    return 301 https://chat.payoor.store$request_uri;
}

server {
    listen 80;
    server_name server.development.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name server.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name server.development.payoor.store;

    ssl_certificate /etc/nginx/certs/nodeserver/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nodeserver/privkey.pem;

    location / {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://nodeserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name server.payoor.store;

    ssl_certificate /etc/nginx/certs/nodeserver/prod/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nodeserver/prod/privkey.pem;

    # Handle preflight OPTIONS requests
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://chat.payoor.store' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Add CORS headers for regular requests
        add_header 'Access-Control-Allow-Origin' 'https://chat.payoor.store' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;

        # Proxy pass to the backend server
        proxy_pass http://nodeserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}


