server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name payoor.store www.payoor.store;

    ssl_certificate /etc/nginx/data/certs/wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/data/certs/wildcard/privkey.pem;
    
    #return 301 https://chat.payoor.store$request_uri;
    if ($http_user_agent ~* '(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge |maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino|android|ipad|playbook|silk') {
        return 301 https://chat.payoor.store$request_uri;
    }
    
    if ($http_user_agent ~* 'iphone|ipod|ipad') {
        return 301 https://chat.payoor.store$request_uri;
    }

    location / {
        return 200 '<!DOCTYPE html>
        <html>
        <head>
            <title>Payoor</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
                body {
                    font-family: Arial, sans-serif;
                    margin: 0;
                    padding: 0;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    background-color: rgba(36, 155, 72, 1);
                    color: white;
                }
                .loader {
                    border: 5px solid rgba(255, 255, 255, 0.3);
                    border-top: 5px solid white;
                    border-radius: 50%;
                    width: 50px;
                    height: 50px;
                    animation: spin 1s linear infinite;
                    margin-bottom: 20px;
                }
                @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
                .container {
                    text-align: center;
                }
                .logo {
                    font-size: 24px;
                    font-weight: bold;
                    margin-bottom: 20px;
                }
            </style>
            <script>
                window.onload = function() {
                    if (window.innerWidth < 768 || 
                        (window.innerWidth < 1024 && window.matchMedia("(orientation: portrait)").matches) ||
                        (window.innerWidth < 1366 && window.devicePixelRatio > 2)) {
                        const path = window.location.pathname === '/' ? '' : window.location.pathname;
                        window.location.href = "https://chat.payoor.store" + path + window.location.search;
                    } else {
                        const path = window.location.pathname === '/' ? '' : window.location.pathname;
                        window.location.href = "/desktop" + path + window.location.search;
                    }
                };
            </script>
        </head>
        <body>
            <div class="container">
                <div class="logo">Payoor</div>
                <div class="loader"></div>
                <p>Loading your experience...</p>
            </div>
        </body>
        </html>';
        add_header Content-Type text/html;
    }

    location /desktop {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://browserui:8086;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name server.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name server.payoor.store;

    ssl_certificate /etc/nginx/data/certs/wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/data/certs/wildcard/privkey.pem;

    location / {
        proxy_pass http://nodeserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
