server {
    listen 80;
    server_name llmserver.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name llmserver.payoor.store;
    
    ssl_certificate /etc/nginx/data/certs/wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/data/certs/wildcard/privkey.pem;
    
    location / {
        proxy_pass http://llmserver:8084;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;
        proxy_redirect off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        
        add_header 'Access-Control-Allow-Origin' 'https://chat.payoor.store' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, session-id' always;
        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://chat.payoor.store' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, session-id' always;
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }
    }
}

server {
    listen 443 ssl;
    server_name socket.payoor.store;

    ssl_certificate /etc/nginx/data/certs/wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/data/certs/wildcard/privkey.pem;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://services:8085;
        proxy_redirect off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}