server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name payoor.store www.payoor.store;

    ssl_certificate /etc/nginx/data/certs/home/prod/fullchain.pem;
    ssl_certificate_key /etc/nginx/data/certs/home/prod/privkey.pem;
    
    return 301 https://chat.payoor.store$request_uri;
}

server {
    listen 80;
    server_name server.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name server.payoor.store;

    ssl_certificate /etc/nginx/data/certs/nodeserver/prod/fullchain.pem;
    ssl_certificate_key /etc/nginx/data/certs/nodeserver/prod/privkey.pem;

    location / {
        proxy_pass http://nodeserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name chat.payoor.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.payoor.store;

    ssl_certificate /etc/nginx/data/certs/chatuiserver/prod/fullchain.pem;
    ssl_certificate_key /etc/nginx/data/certs/chatuiserver/prod/privkey.pem;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://chatuiserver:8083;
        proxy_redirect off;
    }
}

